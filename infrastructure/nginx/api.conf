# API gateway. Replace api.example.com then:
#   sudo ln -s /opt/fulfillx/infrastructure/nginx/api.conf /etc/nginx/sites-enabled/fulfillx-api.conf
#   sudo certbot --nginx -d api.example.com

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/fulfillx-proxy.conf;
    }
}
