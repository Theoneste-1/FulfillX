server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${APP_ORIGIN:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:5}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:10}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@rateLimitKeyResolver}"
      filter:
        request-rate-limiter:
          deny-empty-key: false
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth,/api/v1/auth/**
        - id: users-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/users,/api/v1/users/**
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/inventory,/api/v1/inventory/**
        - id: warehouse-service
          uri: ${WAREHOUSE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/warehouses,/api/v1/warehouses/**
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/shipments,/api/v1/shipments/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/payments,/api/v1/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/notifications,/api/v1/notifications/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/analytics,/api/v1/analytics/**

fulfillx:
  security:
    jwt:
      secret: ${JWT_SECRET:fulfillx-demo-jwt-secret-change-me-32bytes!!}
      issuer: fulfillx-auth
      audience: fulfillx-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    com.fulfillx: INFO
