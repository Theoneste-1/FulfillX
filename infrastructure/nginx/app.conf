# Operations dashboard. Replace app.example.com then:
#   sudo ln -s /opt/fulfillx/infrastructure/nginx/app.conf /etc/nginx/sites-enabled/fulfillx-app.conf
#   sudo certbot --nginx -d app.example.com

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/fulfillx-proxy.conf;
    }
}
