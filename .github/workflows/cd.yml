name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and (optionally) deploy. Defaults to the git SHA.
        required: false
      deploy:
        description: Deploy to the server after pushing images (requires ENABLE_DEPLOY=true)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  images:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package JARs
        run: mvn -B -DskipTests package

      - name: Image metadata
        id: meta
        run: |
          REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "registry=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: docker buildx bake --push

  deploy:
    name: Deploy to server
    needs: images
    if: ${{ vars.ENABLE_DEPLOY == 'true' && (github.event_name == 'push' || github.event.inputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose and infra files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/fulfillx' }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          rsync -az \
            --exclude '.git' \
            --exclude '**/target' \
            --exclude '**/node_modules' \
            --exclude '**/.next' \
            docker-compose.prod.yml \
            docker-bake.hcl \
            infrastructure \
            deploy \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Pull images and recreate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/fulfillx' }}
          IMAGE_REGISTRY: ${{ needs.images.outputs.registry }}
          IMAGE_TAG: ${{ needs.images.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            IMAGE_TAG="$IMAGE_TAG" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            'bash -s' <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          export IMAGE_REGISTRY IMAGE_TAG
          chmod +x deploy/*.sh
          bash deploy/server-up.sh
          EOF

      - name: Smoke check through the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'curl -fsS --retry 20 --retry-all-errors --retry-delay 3 http://127.0.0.1:8080/actuator/health'
