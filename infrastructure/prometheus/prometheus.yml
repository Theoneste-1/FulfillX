global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: fulfillx-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8081
          - catalog-service:8082
          - order-service:8083
          - inventory-service:8084
          - warehouse-service:8085
          - shipment-service:8086
          - payment-service:8087
          - notification-service:8088
          - analytics-service:8089
          - api-gateway:8080
        labels:
          platform: fulfillx
