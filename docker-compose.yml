services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillx
      POSTGRES_PASSWORD: fulfillx
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillx"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.events --partitions 3 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payments.events --partitions 3 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory.events --partitions 3 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic warehouses.events --partitions 3 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic shipments.events --partitions 3 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notifications.events --partitions 3 --replication-factor 1"

  jaeger:
    image: jaegertracing/all-in-one:1.66
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_auth
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  catalog-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_catalog
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  warehouse-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: warehouse-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_warehouse
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_inventory
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8085
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"

  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_order
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      CATALOG_SERVICE_URL: http://catalog-service:8082
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_payment
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8087:8087"

  shipment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: shipment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_shipment
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      FULFILLX_DEMO: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_notification
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"

  analytics-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillx_analytics
      SPRING_DATASOURCE_USERNAME: fulfillx
      SPRING_DATASOURCE_PASSWORD: fulfillx
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8089:8089"

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE: api-gateway
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      CATALOG_SERVICE_URI: http://catalog-service:8082
      ORDER_SERVICE_URI: http://order-service:8083
      INVENTORY_SERVICE_URI: http://inventory-service:8084
      WAREHOUSE_SERVICE_URI: http://warehouse-service:8085
      SHIPMENT_SERVICE_URI: http://shipment-service:8086
      PAYMENT_SERVICE_URI: http://payment-service:8087
      NOTIFICATION_SERVICE_URI: http://notification-service:8088
      ANALYTICS_SERVICE_URI: http://analytics-service:8089
      JWT_SECRET: fulfillx-demo-jwt-secret-change-me-32bytes!!
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - auth-service
      - catalog-service
      - order-service
    ports:
      - "8080:8080"

  operations-dashboard:
    build:
      context: ./frontend/operations-dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
      API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
