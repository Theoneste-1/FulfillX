# One hostname for the UI and the API (no CORS). Use this OR api.conf+app.conf, not both.
# Browser calls /api/... on the same host — set PUBLIC_API_URL= empty in .env
#
#   sudo ln -s /opt/fulfillx/infrastructure/nginx/single-host.conf /etc/nginx/sites-enabled/fulfillx.conf
#   sudo certbot --nginx -d fulfillx.example.com

server {
    listen 80;
    listen [::]:80;
    server_name fulfillx.example.com;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        include snippets/fulfillx-proxy.conf;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080/actuator/;
        include snippets/fulfillx-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/fulfillx-proxy.conf;
    }
}
