name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    name: Maven unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Unit tests
        run: mvn -B test
