# Optional Grafana. Protect this host; it is an admin surface.
#   sudo ln -s /opt/fulfillx/infrastructure/nginx/grafana.conf /etc/nginx/sites-enabled/fulfillx-grafana.conf
#   sudo certbot --nginx -d grafana.example.com

server {
    listen 80;
    listen [::]:80;
    server_name grafana.example.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include snippets/fulfillx-proxy.conf;
    }
}
